<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lima Proxy Manager</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --card-hover: #1a2744;
    --border: #2a3a5c;
    --text: #e0e0e0;
    --text-muted: #8899aa;
    --primary: #4fc3f7;
    --danger: #ef5350;
    --success: #66bb6a;
    --warning: #ffa726;
    --accent: #7c4dff;
    --input-bg: #0f1629;
    --radius: 12px;
    --sub-color: #29b6f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Title bar drag region */
  .titlebar {
    height: 38px;
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .titlebar .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Status card */
  .status-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .status-header h3 {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge-ok { background: rgba(102,187,106,0.15); color: var(--success); }
  .badge-err { background: rgba(239,83,80,0.15); color: var(--danger); }
  .badge-warn { background: rgba(255,167,38,0.15); color: var(--warning); }
  .badge-loading { background: rgba(79,195,247,0.15); color: var(--primary); }

  .status-grid {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 6px 12px;
    font-size: 13px;
  }
  .status-grid .label { color: var(--text-muted); }
  .status-grid .value { font-family: "SF Mono", Monaco, monospace; font-size: 12px; word-break: break-all; }

  /* Subscription card */
  .sub-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .sub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .sub-header h3 {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Subscription list */
  .sub-list { list-style: none; margin-bottom: 10px; }
  .sub-list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .sub-list-item .sub-name {
    font-weight: 600;
    color: var(--text);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub-list-item .sub-meta {
    flex: 1;
    text-align: right;
    font-size: 10px;
    color: var(--text-muted);
    font-family: "SF Mono", monospace;
    white-space: nowrap;
  }
  .sub-list-item .sub-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .sub-list-item .sub-node-count {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(41,182,246,0.15);
    color: var(--sub-color);
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-icon {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.15s;
    -webkit-app-region: no-drag;
    line-height: 1;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.08); }
  .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Add subscription form */
  .add-sub-form {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    display: none;
  }
  .add-sub-form.open { display: block; }
  .add-sub-form .form-row { margin-bottom: 8px; }
  .add-sub-form .form-row label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 3px;
  }
  .add-sub-form .form-row input {
    width: 100%;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-family: "SF Mono", monospace;
    outline: none;
    -webkit-app-region: no-drag;
  }
  .add-sub-form .form-row input:focus { border-color: var(--primary); }

  /* Node list */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .section-title .node-count {
    font-weight: 400;
    font-size: 11px;
  }

  .node-list { list-style: none; }

  /* Node group */
  .node-group {
    margin-bottom: 12px;
  }
  .node-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 8px;
    margin-bottom: 4px;
    transition: background 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .node-group-header:hover { background: rgba(255,255,255,0.03); }
  .node-group-header .group-chevron {
    font-size: 10px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .node-group-header.collapsed .group-chevron {
    transform: rotate(-90deg);
  }
  .node-group-header .group-count {
    font-weight: 400;
    font-size: 10px;
    color: var(--text-muted);
  }
  .node-group-body {
    padding-left: 8px;
    border-left: 2px solid var(--border);
    margin-left: 6px;
  }
  .node-group-body.collapsed {
    display: none;
  }
  .node-group[data-type="manual"] > .node-group-body {
    border-left-color: var(--accent);
  }
  .node-group[data-type="subscription"] > .node-group-body {
    border-left-color: var(--sub-color);
  }

  .node-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .node-item:hover { background: var(--card-hover); border-color: var(--primary); }
  .node-item.active { border-color: var(--success); box-shadow: 0 0 0 1px var(--success); }
  .node-item .flag { font-size: 22px; flex-shrink: 0; }
  .node-info { flex: 1; min-width: 0; }
  .node-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-detail { font-size: 11px; color: var(--text-muted); font-family: "SF Mono", monospace; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .node-badges { display: flex; gap: 4px; flex-shrink: 0; }
  .node-type {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(124,77,255,0.15);
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .node-source-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(41,182,246,0.1);
    color: var(--sub-color);
    font-weight: 500;
  }
  .node-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    align-items: center;
  }

  /* Latency badge */
  .latency-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 600;
    font-family: "SF Mono", monospace;
    flex-shrink: 0;
  }
  .latency-good { background: rgba(102,187,106,0.15); color: #66bb6a; }
  .latency-ok { background: rgba(255,167,38,0.15); color: #ffa726; }
  .latency-bad { background: rgba(239,83,80,0.15); color: #ef5350; }
  .latency-timeout { background: rgba(136,153,170,0.15); color: #8899aa; }

  /* Buttons */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-app-region: no-drag;
    font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #000; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-sub { background: var(--sub-color); color: #000; }
  .btn-sub:hover { filter: brightness(1.15); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 6px 10px; font-size: 11px; }
  .btn-danger:hover { background: rgba(239,83,80,0.15); }
  .btn-sm { padding: 6px 12px; font-size: 11px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-switch { background: var(--success); color: #000; padding: 6px 12px; font-size: 11px; }
  .btn-switch:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Add node form */
  .add-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .add-form.open { display: block; }
  .form-row { margin-bottom: 10px; }
  .form-row label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .form-row input, .form-row select {
    width: 100%;
    padding: 8px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: "SF Mono", monospace;
    outline: none;
    -webkit-app-region: no-drag;
  }
  .form-row input:focus, .form-row select:focus {
    border-color: var(--primary);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-actions { display: flex; gap: 8px; margin-top: 14px; }

  /* Logs */
  .log-area {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font-family: "SF Mono", Monaco, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text-muted);
    max-height: 200px;
    overflow-y: auto;
    margin-top: 16px;
    white-space: pre-wrap;
    word-break: break-all;
    -webkit-user-select: text;
    user-select: text;
  }

  /* Animations */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .pulse { animation: pulse 1.5s ease-in-out infinite; }

  /* Toast notifications */
  .toast {
    position: fixed;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast-success { background: rgba(102,187,106,0.9); color: #000; }
  .toast-error { background: rgba(239,83,80,0.9); color: #fff; }
</style>
</head>
<body>
<div class="titlebar">
  <span class="status-dot" id="titleDot" style="background:var(--warning)"></span>
  Lima Proxy Manager
</div>

<div class="container">
  <!-- Status Card -->
  <div class="status-card">
    <div class="status-header">
      <h3>📡 代理状态</h3>
      <span class="badge badge-loading" id="statusBadge">检测中...</span>
    </div>
    <div class="status-grid" id="statusGrid">
      <span class="label">协议</span><span class="value" id="sType">-</span>
      <span class="label">服务器</span><span class="value" id="sServer">-</span>
      <span class="label">端口</span><span class="value" id="sPort">-</span>
      <span class="label">SNI</span><span class="value" id="sSni">-</span>
      <span class="label">防火墙</span><span class="value" id="sFw">-</span>
    </div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn btn-sm btn-ghost" onclick="refreshStatus()" id="btnRefreshStatus">🔄 刷新状态</button>
      <button class="btn btn-sm btn-ghost" onclick="testProxy()" id="btnTest">🧪 测试连通</button>
      <button class="btn btn-sm btn-sub" onclick="macProxyReconnect()" id="btnMacReconnect" title="重新选择当前节点并重建 Mac 代理共享 (断连一键自愈)">⚡ 重选当前并重连</button>
      <button class="btn btn-sm btn-sub" onclick="macProxyEnable()" id="btnMacEnable" title="开启 Mac 宿主代理 (支持 Antigravity + 浏览器分流)">🔗 开启 Mac 代理</button>
      <button class="btn btn-sm btn-ghost" onclick="macProxyDisable()" id="btnMacDisable">🛑 关闭 Mac 代理</button>
      <button class="btn btn-sm btn-danger" onclick="macProxyPanic()" id="btnMacPanic" style="margin-left:auto">🚨 彻底恢复直连</button>
    </div>
  </div>

  <!-- Subscription Card (Multi-subscription) -->
  <div class="sub-card">
    <div class="sub-header">
      <h3>📡 订阅管理</h3>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-sub" onclick="updateAllSubscriptions()" id="btnUpdateAllSub">🔄 全部更新</button>
        <button class="btn btn-sm btn-ghost" onclick="toggleAddSubForm()">➕ 添加订阅</button>
      </div>
    </div>

    <!-- Add subscription form -->
    <div class="add-sub-form" id="addSubForm">
      <div class="form-row">
        <label>名称</label>
        <input type="text" id="fSubName" placeholder="例如: TrojanFlare">
      </div>
      <div class="form-row">
        <label>订阅地址</label>
        <input type="text" id="fSubUrl" placeholder="https://...">
      </div>
      <div class="form-row">
        <label>过滤关键词</label>
        <input type="text" id="fSubFilter" placeholder="日本" value="日本">
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-sm btn-primary" onclick="addSubscription()">添加</button>
        <button class="btn btn-sm btn-ghost" onclick="toggleAddSubForm()">取消</button>
      </div>
    </div>

    <!-- Subscription list -->
    <ul class="sub-list" id="subList"></ul>
    <div class="sub-info" id="subSummary" style="font-size:11px;color:var(--text-muted)"></div>
  </div>

  <!-- Node List -->
  <div class="section-title">
    <span>📋 节点列表 <span class="node-count" id="nodeCount"></span></span>
    <div style="display:flex;gap:6px">
      <button class="btn btn-sm btn-ghost" onclick="pingAllNodes()" id="btnPingAll">⚡ 全部测速</button>
      <button class="btn btn-sm btn-ghost" onclick="toggleAddForm()">➕ 手动添加</button>
    </div>
  </div>

  <!-- Add Form -->
  <div class="add-form" id="addForm">
    <div class="form-row">
      <label>名称</label>
      <input type="text" id="fName" placeholder="日本节点-1">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>协议类型</label>
        <select id="fType">
          <option value="trojan">Trojan</option>
          <option value="hysteria2">Hysteria2</option>
          <option value="anytls">AnyTLS</option>
          <option value="vless">VLESS</option>
          <option value="vmess">VMess</option>
          <option value="shadowsocks">Shadowsocks</option>
        </select>
      </div>
      <div class="form-row">
        <label>国旗 Emoji</label>
        <input type="text" id="fFlag" placeholder="🇯🇵" value="🌐">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>服务器地址</label>
        <input type="text" id="fServer" placeholder="1.2.3.4 或 domain.com">
      </div>
      <div class="form-row">
        <label>端口</label>
        <input type="number" id="fPort" placeholder="443" value="443">
      </div>
    </div>
    <div class="form-row">
      <label>密码 / UUID</label>
      <input type="text" id="fPassword" placeholder="密码">
    </div>
    <div class="form-row">
      <label>TLS SNI (留空则与服务器地址相同)</label>
      <input type="text" id="fSni" placeholder="example.com">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary btn-sm" onclick="addNode()">添加节点</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleAddForm()">取消</button>
    </div>
  </div>

  <div id="nodeList"></div>

  <!-- Log output -->
  <div class="log-area" id="logArea">就绪。\n</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Globals ───
let config = null;
let isOperating = false;
let latencyData = {}; // nodeId -> { latency_ms: number }
let collapsedGroups = {}; // groupKey -> boolean

// ─── Security: Sanitize for shell arguments ───
function shellEscape(str) {
  // Replace single quotes with the POSIX-safe pattern: '\''
  return "'" + String(str).replace(/'/g, "'\\''") + "'";
}

// ─── Toast notifications ───
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show toast-' + type;
  setTimeout(() => { toast.className = 'toast'; }, 3000);
}

// ─── Native bridge (when running in Swift WKWebView) or fallback ───
function nativeBridge(cmd, timeoutMs = 60000) {
  return new Promise((resolve, reject) => {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.shell) {
      const callId = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);

      // Timeout guard
      const timer = setTimeout(() => {
        delete window[callId];
        reject(new Error('命令超时 (' + (timeoutMs/1000) + 's)'));
      }, timeoutMs);

      window[callId] = (result) => {
        clearTimeout(timer);
        delete window[callId];
        resolve(result);
      };
      window.webkit.messageHandlers.shell.postMessage({cmd, callId});
    } else {
      resolve(null);
    }
  });
}

// ─── Load config ───
async function loadConfig() {
  try {
    const result = await nativeBridge('cat ~/.lima-proxy/config.json');
    if (result) {
      config = JSON.parse(result);
    } else {
      try {
        const resp = await fetch('config.json');
        const text = await resp.text();
        config = JSON.parse(text);
      } catch(e) {
        config = {version:1, active_node:null, nodes:[], subscriptions:[]};
      }
    }
  } catch(e) {
    appendLog('⚠️ 加载配置失败: ' + e.message);
    config = {version:1, active_node:null, nodes:[], subscriptions:[]};
  }
  // Normalize: ensure subscriptions array exists
  if (!config.subscriptions) {
    config.subscriptions = [];
    // Migrate legacy single subscription if present
    if (config.subscription_url) {
      config.subscriptions.push({
        id: 'sub-legacy',
        name: '订阅',
        url: config.subscription_url,
        filter: '日本',
        updated_at: config.subscription_updated || ''
      });
    }
  }
  if (!config.nodes) config.nodes = [];
  renderNodes();
  renderSubscriptions();
}

// ─── Execute CLI command (safe) ───
async function runCommand(cmd, timeoutMs = 60000) {
  appendLog('$ ' + cmd);
  try {
    const result = await nativeBridge(cmd, timeoutMs);
    if (result !== null) {
      appendLog(result);
      return result;
    } else {
      appendLog('[浏览器模式下无法执行命令]');
      return null;
    }
  } catch(e) {
    appendLog('❌ ' + e.message);
    showToast(e.message, 'error');
    return null;
  }
}

// ─── Helper: get subscription name by id ───
function getSubName(subId) {
  if (!config || !config.subscriptions) return subId;
  const sub = config.subscriptions.find(s => s.id === subId);
  return sub ? sub.name : subId;
}

// ─── Helper: count nodes for a source ───
function countNodesForSource(source) {
  if (!config) return 0;
  return config.nodes.filter(n => n.source === source).length;
}

// ─── Render subscriptions ───
function renderSubscriptions() {
  if (!config) return;
  const list = document.getElementById('subList');
  list.innerHTML = '';

  const subs = config.subscriptions || [];
  const summary = document.getElementById('subSummary');

  if (subs.length === 0) {
    summary.textContent = '暂无订阅，点击"➕ 添加订阅"开始';
    return;
  }

  const totalSubNodes = config.nodes.filter(n => n.source && n.source !== 'manual').length;
  summary.textContent = subs.length + ' 个订阅 · ' + totalSubNodes + ' 个节点';

  subs.forEach(sub => {
    const nodeCount = countNodesForSource(sub.id);
    const li = document.createElement('li');
    li.className = 'sub-list-item';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'sub-name';
    nameSpan.textContent = sub.name || sub.id;

    const countSpan = document.createElement('span');
    countSpan.className = 'sub-node-count';
    countSpan.textContent = nodeCount + ' 节点';

    const metaSpan = document.createElement('span');
    metaSpan.className = 'sub-meta';
    if (sub.updated_at) {
      metaSpan.textContent = sub.updated_at;
    } else {
      metaSpan.textContent = '未更新';
    }
    if (sub.filter) {
      metaSpan.textContent += ' · 🔍 ' + sub.filter;
    }

    const actionsDiv = document.createElement('span');
    actionsDiv.className = 'sub-actions';

    const updateBtn = document.createElement('button');
    updateBtn.className = 'btn-icon';
    updateBtn.textContent = '🔄';
    updateBtn.title = '更新此订阅';
    updateBtn.disabled = isOperating;
    updateBtn.dataset.subId = sub.id;
    updateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      updateOneSubscription(e.currentTarget.dataset.subId);
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn-icon';
    deleteBtn.textContent = '🗑';
    deleteBtn.title = '删除订阅';
    deleteBtn.disabled = isOperating;
    deleteBtn.dataset.subId = sub.id;
    deleteBtn.dataset.subName = sub.name || sub.id;
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeSubscription(e.currentTarget.dataset.subId, e.currentTarget.dataset.subName);
    });

    actionsDiv.appendChild(updateBtn);
    actionsDiv.appendChild(deleteBtn);

    li.appendChild(nameSpan);
    li.appendChild(countSpan);
    li.appendChild(metaSpan);
    li.appendChild(actionsDiv);
    list.appendChild(li);
  });
}

// ─── Render node list with groups (XSS-safe) ───
function renderNodes() {
  if (!config) return;
  const container = document.getElementById('nodeList');
  container.innerHTML = '';

  const count = document.getElementById('nodeCount');
  count.textContent = '(' + config.nodes.length + ')';

  // Group nodes by source
  const groups = {};
  config.nodes.forEach(node => {
    const src = node.source || 'manual';
    if (!groups[src]) groups[src] = [];
    groups[src].push(node);
  });

  // Determine group order: manual first, then subscriptions
  const groupKeys = [];
  if (groups['manual']) groupKeys.push('manual');
  // Add subscription groups in subscription order
  if (config.subscriptions) {
    config.subscriptions.forEach(sub => {
      if (groups[sub.id]) groupKeys.push(sub.id);
    });
  }
  // Any remaining sources
  Object.keys(groups).forEach(k => {
    if (!groupKeys.includes(k)) groupKeys.push(k);
  });

  groupKeys.forEach(groupKey => {
    const nodes = groups[groupKey];
    const isManual = groupKey === 'manual';
    const groupType = isManual ? 'manual' : 'subscription';

    const groupDiv = document.createElement('div');
    groupDiv.className = 'node-group';
    groupDiv.dataset.type = groupType;

    // Group header
    const header = document.createElement('div');
    header.className = 'node-group-header';
    if (collapsedGroups[groupKey]) header.classList.add('collapsed');

    const chevron = document.createElement('span');
    chevron.className = 'group-chevron';
    chevron.textContent = '▼';

    const headerText = document.createElement('span');
    if (isManual) {
      headerText.textContent = '📌 手动添加';
    } else {
      headerText.textContent = '📡 ' + getSubName(groupKey);
    }

    const groupCount = document.createElement('span');
    groupCount.className = 'group-count';
    groupCount.textContent = '(' + nodes.length + ' 节点)';

    header.appendChild(chevron);
    header.appendChild(headerText);
    header.appendChild(groupCount);

    header.addEventListener('click', () => {
      collapsedGroups[groupKey] = !collapsedGroups[groupKey];
      header.classList.toggle('collapsed');
      body.classList.toggle('collapsed');
    });

    // Group body
    const body = document.createElement('div');
    body.className = 'node-group-body';
    if (collapsedGroups[groupKey]) body.classList.add('collapsed');

    nodes.forEach(node => {
      const isActive = config.active_node === node.id;
      const li = document.createElement('div');
      li.className = 'node-item' + (isActive ? ' active' : '');

      // Build DOM elements safely (no innerHTML with user data)
      const flagSpan = document.createElement('span');
      flagSpan.className = 'flag';
      flagSpan.textContent = node.flag || '🌐';

      const infoDiv = document.createElement('div');
      infoDiv.className = 'node-info';

      const nameDiv = document.createElement('div');
      nameDiv.className = 'node-name';
      nameDiv.textContent = (isActive ? '▶ ' : '') + (node.name || node.id);

      const detailDiv = document.createElement('div');
      detailDiv.className = 'node-detail';

      const addrSpan = document.createElement('span');
      addrSpan.textContent = node.server + ':' + node.server_port;
      detailDiv.appendChild(addrSpan);

      if (!isManual) {
        const srcBadge = document.createElement('span');
        srcBadge.className = 'node-source-badge';
        srcBadge.textContent = '📡 订阅';
        detailDiv.appendChild(srcBadge);
      }

      infoDiv.appendChild(nameDiv);
      infoDiv.appendChild(detailDiv);

      // Badges column
      const badgesDiv = document.createElement('div');
      badgesDiv.className = 'node-badges';
      badgesDiv.style.cssText = 'display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0';

      const typeSpan = document.createElement('span');
      typeSpan.className = 'node-type';
      typeSpan.textContent = node.type;
      badgesDiv.appendChild(typeSpan);

      // Latency badge (if available)
      const latInfo = latencyData[node.id];
      if (latInfo !== undefined) {
        const latBadge = createLatencyBadge(latInfo);
        badgesDiv.appendChild(latBadge);
      }

      // Actions
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'node-actions';

      if (isActive) {
        const activeSpan = document.createElement('span');
        activeSpan.style.cssText = 'color:var(--success);font-size:11px;white-space:nowrap';
        activeSpan.textContent = '使用中';
        actionsDiv.appendChild(activeSpan);
      } else {
        const switchBtn = document.createElement('button');
        switchBtn.className = 'btn btn-switch';
        switchBtn.textContent = '切换';
        switchBtn.disabled = isOperating;
        switchBtn.dataset.nodeId = node.id;
        switchBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          switchNode(e.currentTarget.dataset.nodeId);
        });
        actionsDiv.appendChild(switchBtn);
      }

      // Ping button
      const pingBtn = document.createElement('button');
      pingBtn.className = 'btn-icon';
      pingBtn.textContent = '⚡';
      pingBtn.title = '测速';
      pingBtn.dataset.nodeId = node.id;
      pingBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        pingSingleNode(e.currentTarget.dataset.nodeId);
      });
      actionsDiv.appendChild(pingBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn btn-danger';
      deleteBtn.textContent = '✕';
      deleteBtn.disabled = isOperating;
      deleteBtn.dataset.nodeId = node.id;
      deleteBtn.dataset.nodeName = node.name || node.id;
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteNode(e.currentTarget.dataset.nodeId, e.currentTarget.dataset.nodeName);
      });
      actionsDiv.appendChild(deleteBtn);

      li.appendChild(flagSpan);
      li.appendChild(infoDiv);
      li.appendChild(badgesDiv);
      li.appendChild(actionsDiv);
      body.appendChild(li);
    });

    groupDiv.appendChild(header);
    groupDiv.appendChild(body);
    container.appendChild(groupDiv);
  });
}

// ─── Latency badge helper ───
function createLatencyBadge(latMs) {
  const badge = document.createElement('span');
  badge.className = 'latency-badge';
  if (latMs < 0) {
    badge.classList.add('latency-timeout');
    badge.textContent = '超时';
  } else if (latMs < 100) {
    badge.classList.add('latency-good');
    badge.textContent = latMs + 'ms';
  } else if (latMs <= 300) {
    badge.classList.add('latency-ok');
    badge.textContent = latMs + 'ms';
  } else {
    badge.classList.add('latency-bad');
    badge.textContent = latMs + 'ms';
  }
  return badge;
}

// ─── Ping single node ───
async function pingSingleNode(nodeId) {
  appendLog('');
  appendLog('⚡ 测速: ' + nodeId);
  try {
    const result = await runCommand(
      '~/.lima-proxy/lima-proxy-switch.sh ping ' + shellEscape(nodeId) + ' 2>&1',
      30000
    );
    if (result) {
      try {
        const data = JSON.parse(result.trim());
        latencyData[data.id || nodeId] = data.latency_ms;
        renderNodes();
        if (data.latency_ms < 0) {
          showToast('测速超时', 'error');
        } else {
          showToast('⚡ ' + data.latency_ms + 'ms');
        }
      } catch(e) {
        // Try to extract JSON from multi-line output
        const lines = result.trim().split('\n');
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const data = JSON.parse(lines[i].trim());
            if (data && data.latency_ms !== undefined) {
              latencyData[data.id || nodeId] = data.latency_ms;
              renderNodes();
              break;
            }
          } catch(ignored) {}
        }
      }
    }
  } catch(e) {
    appendLog('❌ 测速失败: ' + e.message);
  }
}

// ─── Ping all nodes ───
async function pingAllNodes() {
  if (isOperating) {
    showToast('正在操作中，请稍候', 'error');
    return;
  }

  const btn = document.getElementById('btnPingAll');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '';
  const spinSpan = document.createElement('span');
  spinSpan.className = 'spinning';
  spinSpan.textContent = '⚡';
  btn.appendChild(spinSpan);
  btn.appendChild(document.createTextNode(' 测速中...'));

  appendLog('');
  appendLog('⚡ 全部测速...');

  try {
    const result = await runCommand(
      '~/.lima-proxy/lima-proxy-switch.sh ping-all 2>&1',
      120000  // 2 minute timeout for batch
    );
    if (result) {
      try {
        const arr = JSON.parse(result.trim());
        if (Array.isArray(arr)) {
          arr.forEach(item => {
            if (item.id && item.latency_ms !== undefined) {
              latencyData[item.id] = item.latency_ms;
            }
          });
          renderNodes();
          showToast('⚡ 测速完成 (' + arr.length + ' 节点)');
        }
      } catch(e) {
        // Try to find JSON array in multi-line output
        const lines = result.trim().split('\n');
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const arr = JSON.parse(lines[i].trim());
            if (Array.isArray(arr)) {
              arr.forEach(item => {
                if (item.id && item.latency_ms !== undefined) {
                  latencyData[item.id] = item.latency_ms;
                }
              });
              renderNodes();
              showToast('⚡ 测速完成 (' + arr.length + ' 节点)');
              break;
            }
          } catch(ignored) {}
        }
      }
    }
  } catch(e) {
    appendLog('❌ 全部测速失败: ' + e.message);
    showToast('测速失败', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

// ─── Switch node (safe) ───
async function switchNode(nodeId) {
  if (isOperating) return;
  isOperating = true;

  const node = config.nodes.find(n => n.id === nodeId);
  if (!node) {
    isOperating = false;
    return;
  }

  setBadge('切换中...', 'loading');
  setTitleDot('var(--warning)');
  appendLog('');
  appendLog('🔄 切换到: ' + node.name + ' [' + node.type + ']');
  renderNodes();

  try {
    // Safe: use shellEscape for the nodeId
    const result = await runCommand(
      '~/.lima-proxy/lima-proxy-switch.sh switch ' + shellEscape(nodeId) + ' 2>&1',
      120000  // 2 minute timeout for switch
    );
  } finally {
    isOperating = false;
  }

  await loadConfig();
  await refreshStatus();
  showToast('✅ 已切换到 ' + node.name);
}

// ─── Add node (safe) ───
async function addNode() {
  const name = document.getElementById('fName').value.trim();
  const type = document.getElementById('fType').value;
  const server = document.getElementById('fServer').value.trim();
  const port = parseInt(document.getElementById('fPort').value) || 443;
  const password = document.getElementById('fPassword').value.trim();
  const sni = document.getElementById('fSni').value.trim() || server;
  const flag = document.getElementById('fFlag').value.trim() || '🌐';

  if (!name || !server || !password) {
    appendLog('❌ 请填写 名称、服务器、密码');
    showToast('请填写必填字段', 'error');
    return;
  }

  const id = type + '-' + server.replace(/\./g, '-') + '-' + port;
  const nodeJson = JSON.stringify({id, name, type, server, server_port:port, password, tls_sni:sni, flag});

  // Safe: pipe JSON through stdin instead of shell argument
  await runCommand('echo ' + shellEscape(nodeJson) + ' | ~/.lima-proxy/lima-proxy-switch.sh add "$(cat -)" 2>&1');
  toggleAddForm();

  // Clear form
  ['fName','fServer','fPassword','fSni'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPort').value = '443';

  await loadConfig();
  showToast('✅ 节点已添加');
}

  try {
    await runCommand('~/.lima-proxy/lima-proxy-switch.sh delete ' + shellEscape(nodeId) + ' 2>&1');
  } finally {
    isOperating = false;
  }

  await loadConfig();
  showToast('已删除: ' + nodeName);
}

async function addSubscription() {

    showToast('正在操作中，请稍候', 'error');

function parseStatus(text) {
  const get = (label) => {
    const m = text.match(new RegExp(label + '\\s+(.+)'));
    return m ? m[1].trim() : '-';
  };
  document.getElementById('sType').textContent = get('协议:');
  document.getElementById('sServer').textContent = get('服务器:');
  document.getElementById('sPort').textContent = get('端口:');
  document.getElementById('sSni').textContent = get('SNI:');
  document.getElementById('sFw').textContent = get('防火墙:');

  if (text.includes('✅') && text.includes('HTTP')) {
    setBadge('已连接', 'ok');
    setTitleDot('var(--success)');
  } else if (text.includes('❌') && text.includes('连接失败')) {
    setBadge('不可用', 'err');
    setTitleDot('var(--danger)');
  } else if (text.includes('active')) {
    setBadge('服务运行中', 'warn');
    setTitleDot('var(--warning)');
  }
}

  btn.disabled = true;
  btn.textContent = '⏳ 恢复中...';
  appendLog('🚨 正在执行紧急灾备恢复 (Panic Reset)...');
  try {
    const res = await runCommand('~/.lima-proxy/mac-proxy-bridge.sh panic-reset 2>&1', 15000);
    appendLog(res);
    showToast('🚨 已彻底恢复纯净物理直连！');
    setBadge('纯净直连', 'ok');
  } catch (e) {
    appendLog('❌ 恢复失败: ' + e.message);
    showToast('❌ 恢复失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚨 彻底恢复直连';
  }
}

async function macProxyReconnect() {
  const btn = document.getElementById('btnMacReconnect');
  btn.disabled = true;
  btn.textContent = '⏳ 自愈重连中...';
  appendLog('⚡ 正在执行当前节点重选与 Mac 代理共享重置 (自愈)...');
  try {
    const res = await runCommand('~/.lima-proxy/lima-proxy-reconnect.sh 2>&1', 45000);
    appendLog(res);
    await loadConfig();
    await refreshStatus();
    showToast('⚡ 重选当前节点并重连成功！');
  } catch (e) {
    appendLog('❌ 重连失败: ' + e.message);
    showToast('❌ 重连失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '⚡ 重选当前并重连';
  }
}

// ─── Auto Sync on Focus / Visibility ───
window.addEventListener('focus', () => {
  loadConfig();
  refreshStatus();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    loadConfig();
    refreshStatus();
  }
});

// ─── Init ───
loadConfig();
</script>
